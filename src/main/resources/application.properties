spring.application.name=cinema-back

# Railway provides PORT; falls back to 8080 locally
server.port=${PORT:8080}

# Local development only: also read values from a .env file in the project root.
# "optional:" means nothing happens on Railway, where there is no .env file.
spring.config.import=optional:file:.env[.properties]

# ====================================================
# PostgreSQL (Neon)
# DB_URL must start with jdbc:postgresql://
# ====================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (dialect is auto-detected, so it is not set here)
spring.jpa.hibernate.ddl-auto=update

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=alpha

# ----------------------------------------------------
# JWT (JWT_SECRET must be a Base64 string: openssl rand -base64 32)
# ----------------------------------------------------
jwt.secret=${JWT_SECRET}
# Access token: 24 hours (ms)
jwt.expiration=86400000
# Refresh token: 7 days (ms)
jwt.refresh-expiration=604800000

# ----------------------------------------------------
# Email (Mailjet HTTP API, used instead of SMTP)
# Empty defaults let the app start even if these are not set yet.
# ----------------------------------------------------
mail.api-key=${MAIL_API_KEY:}
mail.api-secret=${MAIL_API_SECRET:}
mail.sender-email=${MAIL_SENDER_EMAIL:}
mail.sender-name=${MAIL_SENDER_NAME:CinemaX}

# ----------------------------------------------------
# File upload limits
# ----------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ----------------------------------------------------
# Telegram bot
# ----------------------------------------------------
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.chat-id=${TELEGRAM_CHAT_ID:}

# ----------------------------------------------------
# Cloudinary (property names kept exactly as your code reads them)
# ----------------------------------------------------
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# ----------------------------------------------------
# Cloudflare Turnstile
# ----------------------------------------------------
turnstile.verify-url=https://challenges.cloudflare.com/turnstile/v0/siteverify
turnstile.secret-key=${TURNSTILE_SECRET_KEY:}

# ----------------------------------------------------
# Keycloak (social login). Not deployed yet, so social login only works locally.
# ----------------------------------------------------
keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/cinemax}

# ----------------------------------------------------
# CORS: frontend origins allowed to call this API (comma-separated, no spaces).
# Override on Railway with CORS_ALLOWED_ORIGINS. Setting it REPLACES this default list.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://www.porsou.store,https://porsou.store,http://localhost:3000,https://cinema-frontend-py8v.vercel.app,https://cinema-frontend-theta.vercel.app}

# ----------------------------------------------------
# Bakong / KHQR
# ----------------------------------------------------
bakong.bearer.token=${BAKONG_BEARER_TOKEN:}
bakong.api.url=https://api-bakong.nbc.gov.kh/v1
bakong.account.id=sopha_khoeurn@bkrt
bakong.merchant.name=CinemaX
bakong.merchant.city=Phnom Penh
bakong.testing-mode=${BAKONG_TESTING_MODE:false}


spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.jpa.properties.hibernate.default_batch_fetch_size=20